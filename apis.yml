aid: curology
name: Curology
description: 'Curology is a direct-to-consumer skincare and telehealth company founded
  in 2014 and based in San Francisco, California. It pairs online dermatology providers
  (dermatologists, nurse practitioners, and physician assistants) with custom-compounded
  prescription topical treatments for acne, anti-aging, and other skin concerns, delivered
  as a subscription. Care is delivered through a secure telemedicine platform where
  patients complete a skin assessment, upload photos, and receive a personalized formula
  plus ongoing provider messaging. Curology is a portfolio company of Forerunner Ventures
  and IVP. It operates as a consumer web and mobile product and does not publish a
  public developer API; this profile tracks the company as part of the API Evangelist
  health/telehealth network.'
